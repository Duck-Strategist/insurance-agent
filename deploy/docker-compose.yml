# 用法（在 deploy/ 目录下）：
#   只起数据库（本地开发后端/前端时用）： docker compose up -d postgres
#   起全套：                             docker compose up -d --build
#   Langfuse 可观测性在 M8 加入，届时用 --profile observability 启动

name: insurance-agent

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance}
      POSTGRES_USER: ${POSTGRES_USER:-insurance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insurance}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      DB__URL: postgresql+asyncpg://${POSTGRES_USER:-insurance}:${POSTGRES_PASSWORD:-insurance}@postgres:5432/${POSTGRES_DB:-insurance}
      # 本地演示默认 local；设 APP_ENV=prod 时必须同时设置 JWT_SECRET，否则后端拒绝启动
      APP__ENV: ${APP_ENV:-local}
      AUTH__JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me-please}
      # 条款入库（M2）：密钥从 deploy/.env 或 shell 环境变量读取，不写进本文件
      RAG__DATA_DIR: /data
      RAG__MINERU_TOKEN: ${MINERU_TOKEN:-}
      RAG__DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # 对话模型（M4）：不设置时用 DashScope qwen-plus 并复用上面的 Key
      LLM__API_KEY: ${LLM_API_KEY:-}
      LLM__BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM__MODEL: ${LLM_MODEL:-qwen-plus}
    volumes:
      # 原始 PDF 与解析缓存放在宿主机，容器重建不丢
      - ../data:/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:
