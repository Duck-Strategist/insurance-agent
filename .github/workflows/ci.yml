name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: insurance
          POSTGRES_USER: insurance
          POSTGRES_PASSWORD: insurance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insurance -d insurance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB__URL: postgresql+asyncpg://insurance:insurance@localhost:5432/insurance
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: 迁移可在真实数据库上执行并回滚
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: ORM 模型与迁移一致（忘记生成迁移时失败）
        run: uv run alembic check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
